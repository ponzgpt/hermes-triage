server {
  listen 80 default_server;
  root /srv/site;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /reports/ { default_type text/markdown; charset utf-8; autoindex on; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
}
